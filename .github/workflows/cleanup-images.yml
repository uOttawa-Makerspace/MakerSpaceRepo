name: Cleanup Old Docker Images

on:
  schedule:
    # Runs every Sunday at midnight UTC
    - cron: "0 0 * * 0"
  workflow_dispatch: # Allows running manually from GitHub UI
    inputs:
      dry-run:
        description: "Only list what would be deleted"
        type: boolean
        default: true

permissions:
  packages: write

# Not shared with the deploy jobs: GitHub keeps one pending run per group, so a
# shared group could silently cancel a waiting deploy. The remaining race (a tag
# moved to an image older than the cut-off during this run) needs a manual
# rollback at Sunday midnight; keep-n-most-recent covers recent rollback targets.
concurrency:
  group: ghcr-image-cleanup
  cancel-in-progress: false

jobs:
  clean-ghcr:
    name: Delete Old Container Images
    # Only the org repo owns the package (forks would hit /orgs/<user>/packages)
    if: github.repository_owner == 'uottawa-makerspace'
    runs-on: ubuntu-latest
    steps:
      - name: Set image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "ACCOUNT=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "PACKAGE=${repo,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GITHUB_TOKEN can't protect tags by name in this action (tag filters
      # need a PAT), so the images behind the deployable tags are protected by
      # digest instead. The action also keeps the per-architecture children of
      # every image it keeps. production and staging must resolve, or the job
      # stops; latest normally points at the production image and is optional.
      - name: Resolve digests of the deployable tags
        id: protect
        run: |
          shas=""
          for tag in production staging latest; do
            digest=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{.Manifest.Digest}}' ||
                     { sleep 10; docker buildx imagetools inspect "$IMAGE:$tag" --format '{{.Manifest.Digest}}'; } || true)
            case "$digest" in
              sha256:*) shas="$shas${shas:+,}$digest" ;;
              *) if [ "$tag" = latest ]; then continue; fi
                 echo "could not resolve $IMAGE:$tag" >&2; exit 1 ;;
            esac
          done
          echo "shas=$shas" >> "$GITHUB_OUTPUT"

      - name: Cleanup old commit images
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: ${{ env.ACCOUNT }}
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: ${{ env.PACKAGE }}
          tag-selection: both
          cut-off: 4w # Delete versions not updated for 4 weeks
          # One pool for staging and production images, so keep enough that
          # recent production-<sha> rollback targets survive busy staging weeks
          keep-n-most-recent: 30
          skip-shas: ${{ steps.protect.outputs.shas }}
          # Scheduled runs delete; manual runs default to a dry run
          dry-run: ${{ inputs.dry-run == true }}
