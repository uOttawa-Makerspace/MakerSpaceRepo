name: CI & Deploy

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]

concurrency:
  # Prevents push and pull_request from cancelling each other,
  # but WILL cancel older runs if you push multiple commits quickly.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
  RAILS_ENV: test
  RUBYOPT: "-W0"

jobs:
  # ==========================================
  # STAGE 1: TESTS & SECURITY
  # ==========================================
  test:
    # Skip pull_request jobs if the branch being pushed is 'staging' or 'master'
    # (because the 'push' event below is already running the test suite for it)
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || (github.head_ref != 'staging' && github.head_ref != 'master'))
    runs-on: ubuntu-latest
    # Parallel suite: ~2 min on 8 cores locally; GitHub runners have 2-4 cores,
    # so allow for the slower runner plus ~3 min of setup (Ruby/Node caches, Vite build).
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          PGDATA: /dev/shm/pgdata
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 3
          --shm-size=512mb

    steps:
      - name: Configure PostgreSQL for speed
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres <<EOF
          ALTER SYSTEM SET fsync = off;
          ALTER SYSTEM SET synchronous_commit = off;
          ALTER SYSTEM SET full_page_writes = off;
          ALTER SYSTEM SET shared_buffers = '256MB';
          SELECT pg_reload_conf();
          EOF

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install libvips
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libvips-dev

      - name: Setup Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.12.0"
          cache: "yarn"

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Cache SSL certificates
        id: cache-certs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: certs
          key: ssl-certs-v2

      - name: Setup SSL certificates
        run: |
          mkdir -p certs
          if [ ! -f certs/saml.crt ]; then
            openssl req -x509 -newkey rsa:2048 -keyout certs/saml.key -out certs/saml.crt -days 365 -nodes -subj "/C=CA/ST=Ontario/L=Ottawa/O=uOttawa/OU=Richard L'Abbé Makerspace/CN=makerepo.com/emailAddress=ci@makerepo.com"
          fi

      - name: Create Credentials File
        run: echo '${{ secrets.CREDENTIALS_JSON }}' > config/makerepo-1632742c49cc.json

      # System specs drive headless Chrome. ubuntu-latest ships matched Google Chrome
      # (on PATH) and chromedriver ($CHROMEWEBDRIVER); spec/support/system.rb reads
      # CHROMEDRIVER_PATH (and falls back to Selenium Manager if unset).
      - name: Expose preinstalled chromedriver to the specs
        run: echo "CHROMEDRIVER_PATH=$CHROMEWEBDRIVER/chromedriver" >> "$GITHUB_ENV"

      # One database per parallel worker (makerspacerepo_test, makerspacerepo_test2, ...)
      - name: Prepare Databases
        run: bundle exec rake parallel:setup

      # Per-file runtimes from the previous run balance the parallel groups
      # (the first run, or a cache miss, falls back to balancing by file size).
      - name: Restore parallel runtime log
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tmp/parallel_runtime_rspec.log
          key: parallel-runtime-${{ github.run_id }}
          restore-keys: parallel-runtime-

      # bin/parallel_rspec prebuilds the Vite test assets once (rails vite:build),
      # runs one rspec process per core, and merges the per-worker coverage.
      # CI=1 -> eager_load + Bullet (raise); COVERAGE=1 -> SimpleCov.
      - name: Run RSpec (parallel)
        run: CI=1 COVERAGE=1 bin/parallel_rspec

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: capybara-failures
          path: tmp/capybara
          if-no-files-found: ignore
          retention-days: 7

  security:
    if: github.event_name != 'pull_request' || (github.head_ref != 'staging' && github.head_ref != 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Brakeman (Static Analysis)
        run: bundle exec brakeman -w2

      - name: Bundle Audit (Gem Vulnerabilities)
        run: bundle exec bundle-audit check --update

      - name: Ruby Audit
        run: bundle exec ruby-audit check

  # ==========================================
  # RELEASE NOTES (after tests and security pass)
  # ==========================================
  # staging -> master releases are squash-merged, so master holds one commit per release while
  # staging keeps every PR merge. Notes are therefore built on staging's history: a release is
  # tagged on the staging commit it shipped (the release PR's head), and the notes run from the
  # previous release's tag to that commit. This job only writes the notes and CHANGELOG.md for the
  # image; publish-release tags and publishes after the production deploy succeeds.
  changelog:
    needs: [test, security]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.target.outputs.version }}
      shipped: ${{ steps.target.outputs.shipped }}

    steps:
      - name: Find the previous release and what this push ships
        id: target
        run: |
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName // ""')
          shipped="$GITHUB_SHA"
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            # the release PR's head, i.e. the staging commit this squash commit was made from
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                     --jq '[.[] | select(.base.ref == "master" and .merged_at != null)][0].head.sha // ""')
            [ -n "$head" ] && shipped="$head"
          fi
          {
            echo "previous=$previous"
            echo "shipped=$shipped"
            echo "version=v$(date -u +'%Y.%m.%d-%H%M%S')"
          } >> "$GITHUB_OUTPUT"

      # Release notes never block a deploy: on failure the image gets the published releases only
      - name: Build the notes
        id: notes
        if: steps.target.outputs.previous != ''
        continue-on-error: true
        uses: mikepenz/release-changelog-builder-action@32e3c96f29a6532607f638797455e9e98cfc703d # v4.2.2
        with:
          fromTag: ${{ steps.target.outputs.previous }}
          toTag: ${{ steps.target.outputs.shipped }}
          configurationJson: |
            {
              "categories": [
                { "title": "## 🚀 Features", "labels": ["feature", "enhancement"] },
                { "title": "## 🐛 Bug Fixes", "labels": ["bug", "fix"] },
                { "title": "## 🧪 Tests", "labels": ["test"] },
                { "title": "## 📦 Other Changes", "labels": [] }
              ],
              "ignore_labels": ["release"],
              "template": "#{{CHANGELOG}}\n\n**Full Changelog**: #{{RELEASE_DIFF}}",
              "pr_template": "- #{{TITLE}} (##{{NUMBER}}) by @#{{AUTHOR}}"
            }

      # The notes hold PR titles, so they reach the shell through the environment, never
      # through ${{ }} interpolation inside the script.
      - name: Write CHANGELOG.md
        env:
          NOTES: ${{ steps.notes.outputs.changelog }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -o pipefail
          printf '%s\n' "$NOTES" > release-notes.md
          {
            if [ -n "$NOTES" ]; then
              if [ "$GITHUB_REF" = "refs/heads/master" ]; then
                printf '# %s (%s)\n\n%s\n\n' "$VERSION" "$(date -u +%Y-%m-%d)" "$NOTES"
              else
                printf '# Unreleased (on staging)\n\n%s\n\n' "$NOTES"
              fi
            fi
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=10" \
              --jq '.[] | select(.draft | not) | "# \(.tag_name) (\(.published_at[0:10]))\n\n\(.body)\n"'
          } > CHANGELOG.md

      - name: Upload the notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: changelog
          path: |
            CHANGELOG.md
            release-notes.md
          if-no-files-found: error
          retention-days: 14

  # ==========================================
  # STAGE 2: PARALLEL NATIVE DOCKER BUILDS
  # ==========================================
  build-staging-images:
    needs: [test, security, changelog]
    # the changelog job only adds CHANGELOG.md; its failure must not stop a build
    if: always() && needs.test.result == 'success' && needs.security.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/staging'
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            digest_tag: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            digest_tag: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The release notes for this commit, read by the /changelog page
      - name: Download CHANGELOG.md
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: changelog

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # Setup Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds natively and pushes raw binary layers by digest
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true
          # Scoped caches prevent ARM and AMD overwriting each other
          cache-from: type=gha,scope=build-${{ matrix.digest_tag }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.digest_tag }}

      # Save unique digest file
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.digest_tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-production-images:
    needs: [test, security, changelog]
    # the changelog job only adds CHANGELOG.md; its failure must not stop a build
    if: always() && needs.test.result == 'success' && needs.security.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    name: Build Production (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            digest_tag: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            digest_tag: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The release notes for this commit, read by the /changelog page
      - name: Download CHANGELOG.md
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: changelog

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true
          # Separate cache scope from staging builds to prevent overwriting
          cache-from: type=gha,scope=build-prod-${{ matrix.digest_tag }}
          cache-to: type=gha,mode=max,scope=build-prod-${{ matrix.digest_tag }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-prod-${{ matrix.digest_tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ==========================================
  # STAGE 3: MERGE MANIFEST & DEPLOY TO STAGING
  # ==========================================
  deploy-staging:
    needs: [test, security, build-staging-images]
    if: always() && needs.build-staging-images.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Download all digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Merge AMD64 and ARM64 digests into unified tags
      - name: Create and push manifest list
        run: |
          cd /tmp/digests
          images=$(printf "${{ env.IMAGE_NAME }}@sha256:%s " *)

          # Create both :staging and :staging-<sha> tags
          docker buildx imagetools create -t ${{ env.IMAGE_NAME }}:staging $images
          docker buildx imagetools create -t ${{ env.IMAGE_NAME }}:staging-${{ github.sha }} $images

      # Trigger deployment on staging server
      - name: Deploy to Staging Server via SSH
        env:
          DEPLOY_ENC_KEY: ${{ secrets.DEPLOY_ENC_KEY }}
        run: |
          # Decrypt SSH key
          openssl enc -d -aes-256-cbc -md sha512 -salt -in config/deploy_id_ed25519_staging_enc -out /tmp/deploy_key -k $DEPLOY_ENC_KEY -a -pbkdf2
          chmod 600 /tmp/deploy_key
          eval "$(ssh-agent -s)"
          ssh-add /tmp/deploy_key

          # Copy the latest docker-compose.staging.yml from repo to server
          scp -o StrictHostKeyChecking=no docker-compose.staging.yml deploy@staging-server.makerepo.com:/var/www/makerrepo-staging/docker-compose.staging.yml

          # Pull latest image and restart containers on server
          ssh -o StrictHostKeyChecking=no deploy@staging-server.makerepo.com << EOF
            cd /var/www/makerrepo-staging
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export DOCKER_IMAGE="${{ env.IMAGE_NAME }}"
            docker compose --env-file .env.staging -f docker-compose.staging.yml pull
            docker compose --env-file .env.staging -f docker-compose.staging.yml up -d --remove-orphans
            docker image prune -f
          EOF

  # ==========================================
  # PRODUCTION DEPLOY
  # ==========================================
  deploy-production:
    needs: [test, security, build-production-images]
    if: always() && needs.build-production-images.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # Download digests from the parallel builds
      - name: Download all digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-prod-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Merge AMD64 and ARM64 into unified :production tags
      - name: Create and push manifest list
        run: |
          cd /tmp/digests
          images=$(printf "${{ env.IMAGE_NAME }}@sha256:%s " *)

          docker buildx imagetools create -t ${{ env.IMAGE_NAME }}:production $images
          docker buildx imagetools create -t ${{ env.IMAGE_NAME }}:latest $images
          docker buildx imagetools create -t ${{ env.IMAGE_NAME }}:production-${{ github.sha }} $images

      # Deploy to Production Server via SSH
      - name: Deploy to Production Server via SSH
        env:
          DEPLOY_ENC_KEY: ${{ secrets.DEPLOY_ENC_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -md sha512 -salt -in config/deploy_id_ed25519_prod_enc -out /tmp/deploy_key -k $DEPLOY_ENC_KEY -a -pbkdf2
          chmod 600 /tmp/deploy_key
          eval "$(ssh-agent -s)"
          ssh-add /tmp/deploy_key

          scp -o StrictHostKeyChecking=no docker-compose.production.yml deploy@prod-server.makerepo.com:/var/www/makerrepo/docker-compose.production.yml

          ssh -o StrictHostKeyChecking=no deploy@prod-server.makerepo.com << EOF
            cd /var/www/makerrepo
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export DOCKER_IMAGE="${{ env.IMAGE_NAME }}"
            docker compose --env-file .env.production -f docker-compose.production.yml pull
            docker compose --env-file .env.production -f docker-compose.production.yml up -d --remove-orphans
            docker image prune -f
          EOF

  # ==========================================
  # STAGE 4: PUBLISH THE RELEASE (after production is live)
  # ==========================================
  # Tags the shipped staging commit, publishes the GitHub Release with the notes the image was
  # built with, and opens a master -> staging sync PR. The sync carries no file changes (the squash
  # commit has staging's content) but makes the squash commit an ancestor of staging, so the next
  # release PR only shows new work. Re-running this job is safe: existing tags, releases and sync
  # PRs are reused.
  publish-release:
    needs: [changelog, deploy-production]
    if: always() && needs.deploy-production.result == 'success' && needs.changelog.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      # A PR opened with the built-in token runs no workflows. If staging requires status checks,
      # add a RELEASE_BOT_TOKEN secret (fine-grained, contents + pull requests write) so they run.
      GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
      VERSION: ${{ needs.changelog.outputs.version }}
      SHIPPED: ${{ needs.changelog.outputs.shipped }}

    steps:
      - name: Download the notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: changelog

      - name: Tag and publish
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --silent 2>/dev/null; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$SHIPPED" --silent
          fi
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName --silent 2>/dev/null; then
            [ -s release-notes.md ] || printf 'Release of %s.\n' "$SHIPPED" > release-notes.md
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$VERSION" --notes-file release-notes.md
          fi

      - name: Open the master -> staging sync PR
        run: |
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base staging --head master --state open --json number --jq '.[0].number // ""')
          if [ -z "$existing" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base staging --head master \
              --title "Sync master into staging after $VERSION" \
              --body "Brings the release squash commit into staging's history, so the next release PR only shows new work. No file changes are expected. Merge with **Create a merge commit**." \
              --label release
            existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base staging --head master --state open --json number --jq '.[0].number')
          fi
          # auto-merge needs "Allow auto-merge" in the repo settings; otherwise the PR waits for a click
          gh pr merge "$existing" --repo "$GITHUB_REPOSITORY" --merge --auto || echo "Auto-merge not available; merge PR #$existing by hand."
