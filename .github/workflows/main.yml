name: CI & Deploy

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]

concurrency:
  # Prevents push and pull_request from cancelling each other,
  # but WILL cancel older runs if you push multiple commits quickly.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
  RAILS_ENV: test
  RUBYOPT: "-W0"

jobs:
  # ==========================================
  # STAGE 1: TESTS & SECURITY
  # ==========================================
  # The RSpec suite runs as three shards (the test matrix below). This job picks the runtime log
  # the shards split by, once, so all three read the same log even when another run saves a newer
  # one meanwhile: with different logs the shards could skip or repeat spec files.
  test-plan:
    # Skip pull_request jobs if the branch being pushed is 'staging' or 'master'
    # (because the 'push' event below is already running the test suite for it)
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || (github.head_ref != 'staging' && github.head_ref != 'master'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5

    steps:
      # Per-file runtimes saved by the coverage job of an earlier run. The first run, or a
      # cache miss, leaves an empty log, and the specs are then split by file size.
      - name: Restore parallel runtime log
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tmp/parallel_runtime_rspec.log
          key: parallel-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: parallel-runtime-

      - name: Make sure the log exists
        run: |
          mkdir -p tmp
          touch tmp/parallel_runtime_rspec.log
          echo "Runtime log: $(wc -l < tmp/parallel_runtime_rspec.log) files"

      - name: Upload the runtime log for the shards
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parallel-runtime-base
          path: tmp/parallel_runtime_rspec.log
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  test:
    needs: test-plan
    name: test (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Each shard runs a third of the spec files, one rspec process per core (GitHub runners have
    # 4 cores), plus ~3 min of setup (Ruby/Node caches, Vite build).
    timeout-minutes: 15
    strategy:
      # a failing shard does not cancel the others, so one run reports every failure
      fail-fast: false
      matrix:
        # the 3 also appears in SPEC_SHARD below and in the coverage job
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          PGDATA: /dev/shm/pgdata
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 3
          --shm-size=512mb

    steps:
      - name: Configure PostgreSQL for speed
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres <<EOF
          ALTER SYSTEM SET fsync = off;
          ALTER SYSTEM SET synchronous_commit = off;
          ALTER SYSTEM SET full_page_writes = off;
          ALTER SYSTEM SET shared_buffers = '256MB';
          SELECT pg_reload_conf();
          EOF

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ruby-vips loads libvips over FFI, so only the shared library is needed,
      # not the -dev headers (which pull in dozens of extra packages).
      - name: Install libvips
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libvips42t64

      - name: Setup Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Check libvips loads
        run: |
          bundle exec ruby -e 'require "vips"; puts "libvips " + Vips.version_string'

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.12.0"
          cache: "yarn"

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Cache SSL certificates
        id: cache-certs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: certs
          key: ssl-certs-v2

      - name: Setup SSL certificates
        run: |
          mkdir -p certs
          if [ ! -f certs/saml.crt ]; then
            openssl req -x509 -newkey rsa:2048 -keyout certs/saml.key -out certs/saml.crt -days 365 -nodes -subj "/C=CA/ST=Ontario/L=Ottawa/O=uOttawa/OU=Richard L'Abbé Makerspace/CN=makerepo.com/emailAddress=ci@makerepo.com"
          fi

      - name: Create Credentials File
        run: echo '${{ secrets.CREDENTIALS_JSON }}' > config/makerepo-1632742c49cc.json

      # System specs drive headless Chrome. ubuntu-latest ships matched Google Chrome
      # (on PATH) and chromedriver ($CHROMEWEBDRIVER); spec/support/system.rb reads
      # CHROMEDRIVER_PATH (and falls back to Selenium Manager if unset).
      - name: Expose preinstalled chromedriver to the specs
        run: echo "CHROMEDRIVER_PATH=$CHROMEWEBDRIVER/chromedriver" >> "$GITHUB_ENV"

      # One database per parallel worker (makerspacerepo_test, makerspacerepo_test2, ...)
      - name: Prepare Databases
        run: bundle exec rake parallel:setup

      # The same log on every shard (see test-plan); the shard split and the per-core groups
      # inside the shard both balance by it.
      - name: Download parallel runtime log
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: parallel-runtime-base
          path: tmp

      # SPEC_SHARD makes bin/parallel_rspec run only this shard's spec files
      # (.github/scripts/spec-shard.rb). It prebuilds the Vite test assets once (rails vite:build),
      # runs one rspec process per core, and merges the per-worker coverage into
      # coverage/.resultset.json. CI=1 -> eager_load + Bullet (raise); COVERAGE=1 -> SimpleCov.
      # The shard's coverage is partial; the coverage job merges the three.
      - name: Run RSpec (parallel)
        run: CI=1 COVERAGE=1 SPEC_SHARD=${{ matrix.shard }}/3 bin/parallel_rspec

      # Uploaded even when the specs fail, so the next run still balances by runtime.
      # The coverage job merges the three parts and saves them for the next run.
      - name: Upload parallel runtime log
        if: always() && hashFiles('tmp/parallel_runtime_rspec.log') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parallel-runtime-shard-${{ matrix.shard }}
          # a re-run of this job replaces the artifact of the failed attempt
          overwrite: true
          path: tmp/parallel_runtime_rspec.log
          retention-days: 1

      # .resultset.json is a hidden file, which upload-artifact skips unless told otherwise.
      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-shard-${{ matrix.shard }}
          # a re-run of this job replaces the artifact of the failed attempt
          overwrite: true
          path: coverage/.resultset.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: axe-report-shard-${{ matrix.shard }}
          # a re-run of this job replaces the artifact of the failed attempt
          overwrite: true
          path: tmp/axe
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: capybara-failures-shard-${{ matrix.shard }}
          # a re-run of this job replaces the artifact of the failed attempt
          overwrite: true
          path: tmp/capybara
          if-no-files-found: ignore
          retention-days: 7

  # Merges the three shards' coverage into one report (the `coverage` artifact) and their runtime
  # logs into the log the next run splits by. It runs when a shard failed too, so the log is still
  # saved, but the image builds wait for it only after every shard passed. It fails when a shard's
  # coverage is missing or cannot be merged, which holds back the builds, as a failed merge inside
  # the single test job did before the split.
  coverage:
    needs: [test-plan, test]
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Download runtime logs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: tmp/runtime-logs
          pattern: parallel-runtime-*

      # Fresh shard times replace the times this run started from; files a shard did not
      # record (it stopped early) keep their earlier time.
      - name: Merge runtime logs
        run: |
          .github/scripts/runtime-log-merge.rb tmp/runtime-logs/parallel-runtime-base/parallel_runtime_rspec.log tmp/runtime-logs/parallel-runtime-shard-*/parallel_runtime_rspec.log > tmp/parallel_runtime_rspec.log
          echo "Runtime log: $(wc -l < tmp/parallel_runtime_rspec.log) files"

      - name: Save parallel runtime log
        if: hashFiles('tmp/parallel_runtime_rspec.log') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tmp/parallel_runtime_rspec.log
          key: parallel-runtime-${{ github.run_id }}-${{ github.run_attempt }}

      # Each part lands in coverage/coverage-shard-<n>/.resultset.json, which bin/coverage_collate reads.
      - name: Download coverage results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: coverage
          pattern: coverage-shard-*

      - name: Merge coverage
        run: |
          shopt -s nullglob
          parts=(coverage/coverage-shard-*/.resultset.json)
          if [ "${#parts[@]}" -ne 3 ]; then
            echo "::error::Found coverage results for ${#parts[@]} of 3 shards."
            exit 1
          fi
          bin/coverage_collate | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage
          overwrite: true
          if-no-files-found: ignore
          retention-days: 7

  # ==========================================
  # JAVASCRIPT CHECKS (parallel to the RSpec job; Node only: no Ruby, Postgres or certificates)
  # ==========================================
  js:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || (github.head_ref != 'staging' && github.head_ref != 'master'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.12.0"
          cache: "yarn"

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Lint and type-check JavaScript
        run: |
          yarn lint:js
          yarn typecheck:js

      - name: Run JavaScript unit tests
        run: yarn test:js

  # ERB lint needs Ruby and the bundle but nothing else. It is its own job rather than a step of
  # js so it runs in parallel with the Node checks instead of after them, and so js stays free of Ruby.
  erb-lint:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || (github.head_ref != 'staging' && github.head_ref != 'master'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint ERB views
        run: bin/erb-lint

  security:
    if: github.event_name != 'pull_request' || (github.head_ref != 'staging' && github.head_ref != 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Brakeman (Static Analysis)
        run: bundle exec brakeman -w1

      - name: Bundle Audit (Gem Vulnerabilities)
        run: bundle exec bundle-audit check --update

      - name: Ruby Audit
        run: bundle exec ruby-audit check

  # ==========================================
  # RELEASE NOTES (parallel to tests; uses only the API and the checkout)
  # ==========================================
  # staging -> master releases are squash-merged, so master holds one commit per release while
  # staging keeps every PR merge. Notes are therefore built on staging's history: a release is
  # tagged on the staging commit it shipped (the head of the release PR whose merge commit is the
  # pushed master commit), and the notes run from the newest release not on that commit to it.
  # The version is derived from the shipped commit, so a re-run yields the same version.
  # The shell logic lives in .github/scripts and is shared with the Publish release workflow.
  # The image builds wait for this job (a few seconds) because the image carries CHANGELOG.md,
  # but they ignore its result: when it fails the images ship without notes, and publish-release
  # fails with a message pointing to the Publish release workflow.
  changelog:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REF: ${{ github.ref }}
      TARGET_SHA: ${{ github.sha }}
    outputs:
      version: ${{ steps.target.outputs.version }}
      shipped: ${{ steps.target.outputs.shipped }}
      publishable: ${{ steps.target.outputs.publishable }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Find the shipped commit, its version and the previous release
        id: target
        run: .github/scripts/release-resolve.sh

      # Release PRs (staging -> master) and sync PRs (master -> staging) are not changes. Only PRs
      # merged into staging are listed (base_branches, a regex), which drops the release PRs, and
      # sync PRs carry the release label, which ignore_labels drops.
      - name: Build the notes
        id: notes
        if: steps.target.outputs.previous != '' && steps.target.outputs.shipped != ''
        continue-on-error: true
        uses: mikepenz/release-changelog-builder-action@32e3c96f29a6532607f638797455e9e98cfc703d # v4.2.2
        with:
          configuration: .github/release-changelog-config.json
          fromTag: ${{ steps.target.outputs.previous }}
          toTag: ${{ steps.target.outputs.shipped }}

      - name: Write CHANGELOG.md
        env:
          NOTES: ${{ steps.notes.outputs.changelog }}
          VERSION: ${{ steps.target.outputs.version }}
        run: .github/scripts/release-write-notes.sh

      - name: Upload the notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: changelog
          path: |
            CHANGELOG.md
            release-notes.md
          if-no-files-found: error
          retention-days: 14

      # The notes step may not block anything, but it must not fail silently either: the job turns
      # red (after the artifact is uploaded) and publish-release reports it.
      - name: Report a failed notes step
        if: steps.notes.outcome == 'failure'
        run: |
          echo "::error::The release notes could not be built; CHANGELOG.md has published releases only. Run the Publish release workflow for $GITHUB_SHA once fixed."
          exit 1

  # ==========================================
  # STAGE 2: PARALLEL NATIVE DOCKER BUILDS
  # ==========================================
  build-staging-images:
    needs: [test, coverage, js, erb-lint, security, changelog]
    # the changelog job only adds CHANGELOG.md; its result is deliberately not checked
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.coverage.result == 'success' && needs.js.result == 'success' && needs.erb-lint.result == 'success' && needs.security.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/staging' }}
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            digest_tag: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            digest_tag: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The release notes for this commit, read by the /changelog page
      - name: Download CHANGELOG.md
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: changelog

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # Setup Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds natively and pushes raw binary layers by digest
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true
          # Scoped caches prevent ARM and AMD overwriting each other
          cache-from: type=gha,scope=build-${{ matrix.digest_tag }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.digest_tag }}

      # Save unique digest file
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.digest_tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-production-images:
    needs: [test, coverage, js, erb-lint, security, changelog]
    # the changelog job only adds CHANGELOG.md; its result is deliberately not checked
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.coverage.result == 'success' && needs.js.result == 'success' && needs.erb-lint.result == 'success' && needs.security.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    name: Build Production (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            digest_tag: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            digest_tag: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The release notes for this commit, read by the /changelog page
      - name: Download CHANGELOG.md
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: changelog

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true
          # Separate cache scope from staging builds to prevent overwriting
          cache-from: type=gha,scope=build-prod-${{ matrix.digest_tag }}
          cache-to: type=gha,mode=max,scope=build-prod-${{ matrix.digest_tag }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-prod-${{ matrix.digest_tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ==========================================
  # STAGE 3: MERGE MANIFEST & DEPLOY TO STAGING
  # ==========================================
  deploy-staging:
    needs: [test, js, erb-lint, security, build-staging-images]
    if: ${{ !cancelled() && needs.build-staging-images.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Download all digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Merge AMD64 and ARM64 digests into unified tags
      - name: Create and push manifest list
        run: |
          cd /tmp/digests
          images=$(printf "${{ env.IMAGE_NAME }}@sha256:%s " *)

          # Create both :staging and :staging-<sha> tags
          docker buildx imagetools create -t ${{ env.IMAGE_NAME }}:staging $images
          docker buildx imagetools create -t ${{ env.IMAGE_NAME }}:staging-${{ github.sha }} $images

      # Trigger deployment on staging server
      - name: Deploy to Staging Server via SSH
        env:
          DEPLOY_ENC_KEY: ${{ secrets.DEPLOY_ENC_KEY }}
        run: |
          # Decrypt SSH key
          openssl enc -d -aes-256-cbc -md sha512 -salt -in config/deploy_id_ed25519_staging_enc -out /tmp/deploy_key -k $DEPLOY_ENC_KEY -a -pbkdf2
          chmod 600 /tmp/deploy_key
          eval "$(ssh-agent -s)"
          ssh-add /tmp/deploy_key

          # Copy the latest docker-compose.staging.yml from repo to server
          scp -o StrictHostKeyChecking=no docker-compose.staging.yml deploy@staging-server.makerepo.com:/var/www/makerrepo-staging/docker-compose.staging.yml

          # Pull latest image and restart containers on server
          ssh -o StrictHostKeyChecking=no deploy@staging-server.makerepo.com << EOF
            cd /var/www/makerrepo-staging
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export DOCKER_IMAGE="${{ env.IMAGE_NAME }}"
            docker compose --env-file .env.staging -f docker-compose.staging.yml pull
            docker compose --env-file .env.staging -f docker-compose.staging.yml up -d --remove-orphans
            docker image prune -f
          EOF

  # ==========================================
  # PRODUCTION DEPLOY
  # ==========================================
  deploy-production:
    needs: [test, js, erb-lint, security, build-production-images]
    if: ${{ !cancelled() && needs.build-production-images.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # Download digests from the parallel builds
      - name: Download all digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-prod-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Merge AMD64 and ARM64 into unified :production tags
      - name: Create and push manifest list
        run: |
          cd /tmp/digests
          images=$(printf "${{ env.IMAGE_NAME }}@sha256:%s " *)

          docker buildx imagetools create -t ${{ env.IMAGE_NAME }}:production $images
          docker buildx imagetools create -t ${{ env.IMAGE_NAME }}:latest $images
          docker buildx imagetools create -t ${{ env.IMAGE_NAME }}:production-${{ github.sha }} $images

      # Deploy to Production Server via SSH
      - name: Deploy to Production Server via SSH
        env:
          DEPLOY_ENC_KEY: ${{ secrets.DEPLOY_ENC_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -md sha512 -salt -in config/deploy_id_ed25519_prod_enc -out /tmp/deploy_key -k $DEPLOY_ENC_KEY -a -pbkdf2
          chmod 600 /tmp/deploy_key
          eval "$(ssh-agent -s)"
          ssh-add /tmp/deploy_key

          scp -o StrictHostKeyChecking=no docker-compose.production.yml deploy@prod-server.makerepo.com:/var/www/makerrepo/docker-compose.production.yml

          ssh -o StrictHostKeyChecking=no deploy@prod-server.makerepo.com << EOF
            cd /var/www/makerrepo
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export DOCKER_IMAGE="${{ env.IMAGE_NAME }}"
            docker compose --env-file .env.production -f docker-compose.production.yml pull
            docker compose --env-file .env.production -f docker-compose.production.yml up -d --remove-orphans
            docker image prune -f
          EOF

  # ==========================================
  # STAGE 4: PUBLISH THE RELEASE (after production is live)
  # ==========================================
  # Tags the shipped staging commit, publishes the GitHub Release with the notes the image was
  # built with, and opens a master -> staging sync PR (see .github/scripts). Re-running is safe:
  # existing tags, releases and sync PRs are reused. It runs whenever production was deployed;
  # when the notes job failed or the release PR was not found it fails with a message instead of
  # being skipped. Recovery is the manual Publish release workflow, never a re-run of the jobs
  # above, which would rebuild and redeploy production.
  #
  # Repo settings: "Allow auto-merge" (Settings > General) for the sync PR to merge itself, and
  # "Allow GitHub Actions to create and approve pull requests" (Settings > Actions > General)
  # unless a RELEASE_BOT_TOKEN secret is set.
  publish-release:
    needs: [changelog, deploy-production]
    if: ${{ !cancelled() && needs.deploy-production.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      # A PR opened with the built-in token runs no workflows. If staging requires status checks,
      # add a RELEASE_BOT_TOKEN secret (fine-grained, contents + pull requests write) so they run.
      GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
      CHANGELOG_RESULT: ${{ needs.changelog.result }}
      VERSION: ${{ needs.changelog.outputs.version }}
      SHIPPED: ${{ needs.changelog.outputs.shipped }}
      PUBLISHABLE: ${{ needs.changelog.outputs.publishable }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check what can be published
        id: check
        run: |
          ok=true
          if [ "$CHANGELOG_RESULT" != "success" ]; then
            ok=false
            echo "::error::Production is deployed, but the changelog job ended as '$CHANGELOG_RESULT', so no release was published. Run the Publish release workflow for $GITHUB_SHA. Do not re-run these jobs: that would rebuild and redeploy production."
          elif [ "$PUBLISHABLE" != "true" ] || [ -z "$VERSION" ] || [ -z "$SHIPPED" ]; then
            ok=false
            echo "::error::Production is deployed, but no merged staging -> master pull request has merge commit $GITHUB_SHA, so there is no shipped staging commit to tag. Run the Publish release workflow for $GITHUB_SHA once the pull request is visible. Do not re-run these jobs: that would rebuild and redeploy production."
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Download the notes
        if: steps.check.outputs.ok == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: changelog

      - name: Tag and publish
        if: steps.check.outputs.ok == 'true'
        run: .github/scripts/release-publish.sh

      - name: Open the master -> staging sync PR
        if: ${{ !cancelled() }}
        run: .github/scripts/release-sync.sh

      - name: Fail when no release was published
        if: ${{ !cancelled() && steps.check.outputs.ok != 'true' }}
        run: |
          echo "::error::No release was published for $GITHUB_SHA (see the first step)."
          exit 1
