version: 2
updates:
  # Actions are pinned to commit SHAs; this keeps the pins current. A release
  # is only proposed after a week, and major versions get their own PRs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
