# Solid Cache (Rails.cache in production and staging). The entries live in the
# solid_cache_entries table of the `cache` database (config/database.yml, schema in
# db/cache_schema.rb), not in the primary database, so the primary's backups carry
# no cache rows. `db:prepare` (bin/docker-entrypoint) creates and loads it on boot.
# Development and test use :memory_store / :null_store and need no cache database.
default: &default
  store_options:
    # Entries older than this are expired, whatever their own expires_in. Longest
    # real lifetime here is a day (the email-domain verdict); fragments are minutes to an hour.
    # (Rate limits are not here: they count in rate_limit_counters, see RateLimitCounter.)
    max_age: <%= 7.days.to_i %>
    # The table is capped; the oldest entries go first.
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

staging:
  <<: *default
  database: cache

production:
  <<: *default
  database: cache
