default: &default
  adapter: <%= ENV.fetch("DB_ADAPTER") { Rails.application.credentials.dig(Rails.env.to_sym, :database, :adapter) || 'postgresql' } %>
  host: <%= ENV.fetch("DB_HOST") { Rails.application.credentials.dig(Rails.env.to_sym, :database, :host) || 'localhost' } %>
  port: <%= ENV.fetch("DB_PORT") { Rails.application.credentials.dig(Rails.env.to_sym, :database, :port) || 5432 } %>
  username: <%= ENV.fetch("DB_USERNAME") { Rails.application.credentials.dig(Rails.env.to_sym, :database, :username) || 'postgres' } %>
  password: <%= ENV.fetch("DB_PASSWORD") { Rails.application.credentials.dig(Rails.env.to_sym, :database, :password) || 'postgres' } %>
  pool: <%= ENV.fetch("DB_POOL") { ENV.fetch("RAILS_MAX_THREADS") { 10 } } %>

development:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_NAME") { Rails.application.credentials.dig(:development, :database, :name) || 'makerspacerepo_development' } %>
  queue:
    <<: *default
    database: makerspacerepo_queue_development
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: makerspacerepo_cable_development
    migrations_paths: db/cable_migrate

test:
  <<: *default
  # parallel_tests sets TEST_ENV_NUMBER ("", "2", "3", ...): one DB per worker.
  # A git worktree can isolate its test DBs with a git-ignored config/test_db_suffix
  # file (or TEST_DB_SUFFIX); the main checkout has neither, so names are unchanged.
  database: makerspacerepo_test<%= ENV.fetch("TEST_DB_SUFFIX") { f = Rails.root.join("config/test_db_suffix"); (File.read(f).strip if File.exist?(f)) } %><%= ENV['TEST_ENV_NUMBER'] %>

staging:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_NAME") { Rails.application.credentials.dig(:staging, :database, :name) || 'makerspacerepo_staging' } %>
  queue:
    <<: *default
    database: makerspacerepo_queue_staging
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: makerspacerepo_cable_staging
    migrations_paths: db/cable_migrate

production:
  primary:
    <<: *default
    database: "<%= Rails.application.credentials.dig(:production, :database, :name) %>"
  queue:
    <<: *default
    database: makerspacerepo_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: makerspacerepo_cable
    migrations_paths: db/cable_migrate
