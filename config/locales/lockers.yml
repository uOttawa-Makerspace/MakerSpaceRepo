    new_request:
      header: Nouvelle demande de casier
      description_html: |
        <p>Ici, vous pouvez demander la location d'un casier. Des casiers sont offerts aux étudiants de l'Université d'Ottawa et aux membres de la communauté.</p>
        <p>Dès que votre demande est envoyée, nous l'examinerons et vérifierons la disponibilité.
        Vous serez avisé par courriel lorsque votre demande sera approuvée et prête pour le paiement.
        Vous pouvez annuler votre demande à tout moment jusqu'au paiement; une fois payés, les frais de location du casier ne sont pas remboursables.
        <b>Vous ne pouvez avoir qu'une seule demande en attente à la fois.</b></p>

        <p>Vous pourriez obtenir un casier gratuitement si vous êtes :</p>
        <ul>
            <li>un étudiant ayant un projet pour GNG1503, GNG2501 ou un autre cours de conception, ou</li>
            <li>un membre du personnel.</li>
        </ul>
        <p>Pour toute question, contactez-nous à <a href="mailto:ceed@uottawa.ca">ceed@uottawa.ca</a></p>

