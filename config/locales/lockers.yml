      resolved_at: "Résolu le"
      statuses:
        applied: "Appliqué"
        held: "Décision requise"
        refunded: "Remboursé"
        dismissed: "Écarté"
      mark_refunded: "Marquer remboursé"
      dismiss: "Écarter"
      note_placeholder: "Note (facultatif)"
      confirm_refunded: "Marquer ce paiement comme remboursé? Remboursez-le d'abord dans Shopify."
      confirm_dismissed: "Écarter ce paiement sans remboursement?"
