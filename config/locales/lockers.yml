        Réfuser or annuler cette demande.
        L'utilisateur sera notifié de l'annulation or réfusal de sa demande.
        Le casier sera disponible pour une nouvelle affectation.
      end_rental_description: |
        Terminer cette location de casier. L'utilisateur sera notifié de l'annulation. Si donné une période de grâce, l'utilisateur sera informé qu'il a une semaine pour vider le casier.

    held_payments:
      title: "Payé, décision requise"
      intro: "Shopify a signalé ces paiements de casiers, mais ils n'ont pas pu être appliqués à la location. Marquez chacun comme remboursé (après l'avoir remboursé dans Shopify), écartez-le, ou assignez la location."
      badge: "Payé, décision requise"
      alert_title: "Payé, décision requise."
      none: "Aucun paiement ne requiert de décision."
      reasons:
        renter_ineligible: "Le compte du locataire est désactivé ou supprimé. Remboursez le paiement, ou réactivez le compte et assignez le casier."
        rental_cancelled: "La location a été annulée avant l'arrivée de ce paiement. Remboursez le paiement."
        not_activatable: "La location n'a pas pu être activée (par exemple, elle n'a pas de casier). Corrigez la location et assignez-la, ou remboursez le paiement."
        renter_ineligible_active: "Le compte du locataire est désactivé ou supprimé et la location est déjà active. Remboursez le paiement, ou écartez-le avec une note."
        not_activatable_active: "Le paiement n'a pas pu être appliqué et la location est déjà active. Remboursez le paiement, ou écartez-le avec une note."
        already_paid: "Cette location était déjà active et payée : remboursez le doublon."
      was_held: "Était retenu : %{reason}"
      past_reasons:
        renter_ineligible: "compte du locataire désactivé ou supprimé"
        rental_cancelled: "location annulée"
        not_activatable: "la location n'a pas pu être activée"
        already_paid: "doublon d'un paiement antérieur"
