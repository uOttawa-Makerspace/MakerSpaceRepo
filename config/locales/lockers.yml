      title: "Paid, needs a decision"
      intro: "Shopify reported these locker payments, but they could not be applied to the rental. Mark each one refunded (after refunding it in Shopify), dismiss it, or assign the rental."
      badge: "Paid, needs a decision"
      alert_title: "Paid, needs a decision."
