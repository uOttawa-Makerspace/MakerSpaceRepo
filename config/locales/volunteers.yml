      list_of_emails: "List of Emails"
      list_of_users: "List of Users in Program"
    hero:
      title_html: "Volunteer with <span class='text-ceed-orange'>C</span>EED"
      subtitle: "Build, Collaborate & Learn"
      join_button: "Join the Volunteer Program"
    why_volunteer:
      title_html: "Why Volunteer with <span class='text-ceed-orange'>C</span>EED?"
      cards:
        experience:
          title: "Gain Hands-On Experience"
          desc: "Apply your knowledge through real projects and cutting-edge technology."
        skills:
          title: "Build New Skills"
          desc: "Learn through workshops, mentorship, and practical experience."
        community:
          title: "Join a Community"
          desc: "Connect with passionate students, mentors, and innovators across campus."
        career:
          title: "Grow Your Career"
          desc: "Strengthen your resume with meaningful experience and transferable skills."
        impact:
          title: "Make an Impact"
          desc: "Support events, students, and help grow the maker community."
    involvement:
      title: "Choose How You'd Like to Get Involved"
      subtitle: "Whether you have a few hours to spare or want a longer-term commitment, there's a place for you at CEED !!"
      labels:
        involvement: "Involvement"
        requirements: "Requirements"
      types:
        event:
          title: "Event Volunteer"
          badge: "Occasional Commitment"
          desc: "Support CEED events and outreach initiatives while engaging with the campus community."
          involvement:
            - "Assist with flagship events and outreach initiatives"
            - "Help deliver engaging experiences"
            - "Represent CEED at events across campus"
          requirements:
            - "Volunteer Orientation"
        space:
          title: "Weekly Space Volunteer"
          badge: "Weekly Commitment"
          desc: "Support daily operations in our spaces while helping students bring their ideas to life."
          involvement:
            - "Assist students using the space"
            - "Support workshops and training"
            - "Help maintain equipment and workspaces"
          requirements:
            - "Volunteer Orientation"
            - "Three-hour shadowing session in your chosen space"
        project:
          title: "Project Based-Volunteer"
          badge: "Semester-Based"
          desc: "Contribute to engineering projects from concept to prototype while developing practical skills."
          involvement:
            - "Design, build, and prototype solutions"
            - "Use advanced tools and equipment"
            - "Apply your skills to real challenges"
          requirements:
            - "Volunteer Orientation"
            - "Project onboarding"
            - "Complete any training or workshops required for your assigned project."
    bottom_banner:
      title: "Ready To Get Involved ?"
      subtitle: "Choose your pathway and fill out the intake form to get started."
      button: "Join the Volunteer Program"
      questions_html: "Questions? Contact us at <a href='mailto:volunteer@makerepo.com'>volunteer@makerepo.com</a>"

fr:
  volunteers:
    navbar:
      brand_html: "<strong>Programme</strong> de Bénévolat"
      getting_started: "Lancez vous"
      my_stats: "Mes Stats"
      my_tasks: "Mes Tâches"
      volunteer_tasks: "Tâches de bénévolat"
      calendar: "Calendrier"
      next_shadowing_shifts: "Prochaines périodes d'observation"
      add_shadowing_shifts: "Ajouter des périodes d'observation"
      requests: "Demandes"
      tasks: "Tâches"
      new_task: "Nouvelle Tâche"
      announcements: "Annonces"
      new_announcement: "Nouvelle Annonce"
      lists: "Listes"
      list_of_emails: "Liste d'Emails"
      list_of_users: "Liste de bénévoles"
    hero:
      title_html: "Bénévolat avec le <span class='text-ceed-orange'>C</span>GEC"
      subtitle: "Construire, Collaborer & Apprendre"
      join_button: "Rejoindre le Programme de Bénévolat"
    why_volunteer:
      title_html: "Pourquoi faire du bénévolat avec le <span class='text-ceed-orange'>C</span>GEC?"
      cards:
        experience:
          title: "Acquérez une expérience pratique"
          desc: "Mettez vos connaissances en application grâce à des projets concrets et à des technologies de pointe."
        skills:
          title: "Développez de nouvelles compétences"
          desc: "Apprenez grâce à des ateliers, du mentorat et des expériences pratiques."
        community:
          title: "Rejoignez une communauté"
          desc: "Rencontrez des étudiants, des mentors et des innovateurs passionnés sur le campus."
        career:
          title: "Développez votre parcours professionnel"
          desc: "Enrichissez votre CV grâce à des expériences pertinentes et à des compétences transférables."
        impact:
          title: "Faites une différence"
          desc: "Soutenez les événements et les étudiants, et contribuez au développement de la communauté des makers."
    involvement:
      title: "Choisissez Comment Vous Souhaitez Vous Impliquer !"
      subtitle: "Que vous ayez quelques heures à offrir ou que vous souhaitiez vous engager à plus long terme, il y a une place pour vous au CGEC !"
      labels:
        involvement: "Possibilités d'implication"
        requirements: "Exigences pour les bénévoles"
      types:
        event:
          title: "Bénévole aux Événements"
          badge: "Engagement occasionnel"
          desc: "Soutenez les événements du CGEC tout en interagissant avec la communauté universitaire."
          involvement:
            - "Participez aux événements phares et aux initiatives de rayonnement"
            - "Aidez à offrir des expériences engageantes"
            - "Représentez le CGEC lors d’événements sur le campus"
          requirements:
            - "Orientation des bénévoles"
        space:
          title: "Bénévole Hebdomadaire des Espaces"
          badge: "Engagement hebdomadaire"
          desc: "Soutenez les activités quotidiennes de nos espaces tout en aidant les étudiants à donner vie à leurs idées."
          involvement:
            - "Aidez les étudiants à utiliser les espaces"
            - "Soutenez les ateliers et les formations"
            - "Contribuez à l’entretien des équipements et des espaces de travail"
          requirements:
            - "Orientation des bénévoles"
            - "Séance d’observation de trois heures dans l’espace de votre choix"
        project:
          title: "Bénévole de Projet"
          badge: "Engagement semestriel"
          desc: "Contribuez à des projets d’ingénierie, du concept au prototype, tout en développant des compétences pratiques."
          involvement:
            - "Concevez, construisez et prototypez des solutions"
            - "Utilisez des outils et des équipements spécialisés"
            - "Mettez vos compétences en pratique pour relever des défis concrets"
          requirements:
            - "Orientation des bénévoles"
            - "Intégration au projet"
            - "Suivre toute formation ou tout atelier requis pour le projet qui vous est assigné."
    bottom_banner:
      title: "Prêt(e) à vous impliquer ?"
      subtitle: "Choisissez votre parcours et remplissez le formulaire d’inscription pour commencer."
      button: "Rejoindre le Programme de Bénévolat"
      questions_html: "Des questions ? Contactez-nous à <a href='mailto:volunteer@makerepo.com'>volunteer@makerepo.com</a>"
