en:
  job_orders:
    title: "CEED Job Orders"
    header: "From Concept to Creation"
    subtext: "Discover how CEED transforms your ideas into reality through fabrication, design, and prototyping services."
    request_button: "Start a Job Order"
    view_orders_button: "View My Orders"
    intro:
      title: "Your One-Stop Engineering Hub"
      text: "CEED offers technical expertise and equipment to support design, prototyping, and small-scale manufacturing projects for students, researchers, and external clients."
    sections:
      services: "Engineering Services"
      services_text: "Professional support including machining, welding, and design."
      services_list:
        - "Manual Machining"
        - "CNC & Welding"
        - "3D Scanning & Design"
      makerspace: "Creative Fabrication"
      makerspace_text: "Digital tools for rapid prototyping and artistic projects."
      makerspace_list:
        - "3D Printing & Laser Cutting"
        - "Embroidery & PCB Milling"
        - "Custom Apparel & Awards"
      design_consultation:
        title: "Design Consultations"
        subtitle: "Need help with your project?"
        description: "Our experts can assist you with designing, prototyping, and machining any size project to suit your needs."
        services:
          - "Concept development and design assistance"
          - "3D modeling and CAD support"
          - "Material selection guidance"
          - "Prototyping strategies"
          - "Production planning"
        call_to_action: "Schedule a consultation today!"
    pricing:
      title: "Rates & Fees"
      text: "Internal and external rates vary by service. Materials sold separately. One-hour consultations are free."
    # The pages a customer opens from the emailed links: pay, quote approval and its confirmation
    customer_pages:
      thank_you_for_ordering: "Thank You for ordering a Job Order!"
      pay_intro: "You can now pay for your order! Please make sure you verify the pricing before you proceed with the payment. Once the payment has been completed, it is not be possible to cancel it."
      no_payment_data_saved_html: "<b>We do not save any payment information</b>. All data is saved on our Payment Processor's servers."
      # %{amount} = the order total, as money
      total_quote: "Total Quote: %{amount}"
      proceed_to_payment: "Proceed to the payment page"
      approval_intro: "You can Accept or Deny your quote on this page! Please make sure you verify your quote and price before you accept the quote. Once you accept the quote, it might not be possible to cancel it."
      approve_quote: "Approve the Quote"
      deny_quote: "Deny the Quote"
      thank_you_for_answering: "Thank You for Approving/Denying the Job Order!"
    # Contact lines at the bottom of the customer pages; %{email} = a mail link
    contact:
      title: "Having trouble or have any questions? Contact Us!"
      general_html: "%{email} (For General Questions and Administrative issues)"
      technical_html: "%{email} (Website Technical Issues)"
    # The printable invoice
    invoice_page:
      title: "Job Order Invoice"
      number: "Invoice #%{id}"
      address:
        name: "University Of Ottawa Richard L'Abbé Makerspace"
        room: "STM 107"
        street: "150 Louis Pasteur"
        city: "Ottawa, ON K1N 6N5"
      client: "Client : %{name}"
      date: "Date : %{date}"
      payment_method: "Payment Method"
      # %{link} = link to the wiki page on paying for an order
      payment_details_html: "Please see %{link} for payment details"
      item: "Item"
      price: "Price"
      # %{task} = the task's title
      base_fee: "%{task} - Base Fee"
      # Shown when the task has no service of its own
      service: "Service"
      # Shown when the service has no unit of its own
      unit: "unit"
      # %{name} = the option's name
      option: "%{name} (Option)"
      # Shown when a line item has no description
      line_item: "Line Item"
      # %{amount} = an amount of money
      amount: "CAD %{amount}"
      # %{amount} = the total, from amount
      total: "Total: %{amount}"
      print: "Print this page"
    # The customer's order list
    list:
      chats: "Chats"
      user: "User"
      id: "ID"
      submitted: "Submitted"
      type: "Type"
      status: "Status"
      view: "View"
      # After the number of unread chat messages, for screen readers
      unread_messages: "unread messages"
    # Links of the job order menu shown to staff and admins
    navigation:
      all_job_orders_staff_only: "All Job Orders (Staff Only)"
      settings_admin_only: "Settings (Admin Only)"
    # The staff quote modal on an order's page; %{unit} = the service's unit, %{name} = an option's name
    quote_modal:
      # Heading of a task that has no title
      task_number: "Task #%{id}"
      base_fee: "Base Fee (CAD)"
      # Shown when the service has no unit of its own
      unit: "unit"
      service_quantity: "Number of %{unit}"
      service_price: "Price per %{unit} (CAD)"
      option_price: "%{name} (CAD)"
      # Placeholder of the price and quantity fields
      value: "value"
      staff_files: "Staff Files (GCode, PDF, etc.)"
      line_items: "Additional Line Items"
      description: "Description"
      new_line_item: "New Line Item"
      user_comments: "Comments for the user (will send as a chat)"
      user_comments_placeholder: "I will need to add supports"
      staff_comments: "Comments for the staff members"
      staff_comments_placeholder: "Use the Raise 3D"
      # %{amount} = the running total, updated by the page as prices are typed
      total_html: "Total: $%{amount}"
      approve: "Approve"
  job_order_mailer:
    quote_notes: "Note from the staff:"
    hello: "Hello,"
    see_order: "See Order"
    # Subject of a mail to staff about an expedited order; %{subject} = the usual subject
    expedited_subject: "EXPEDITED: %{subject}"
    send_job_submitted:
      subject: "A new Job Order has been submitted"
      preheader: "Makerepo - Job Order Created"
      # %{site_link} = link to makerepo.com
      why_received_html: "You have received this email because a new Job Order has been created on %{site_link}."
      # %{link} = link to the job order admin page, text from page_link
      body_html: "A user has created a Job order with ID %{id}. Check the %{link} for details."
      page_link: "Job Order page"
    send_job_requote_needed:
      subject: "Job Order #%{id} needs a new quote"
      preheader: "Makerepo - Job Order needs a new quote"
      # %{site_link} = link to makerepo.com
      why_received_html: "You have received this email because a quoted Job Order on %{site_link} needs a new quote."
      body: 'Job Order %{id} is back in "Waiting for Staff Approval". Its previous quote can no longer be approved and its previous payment link no longer works. Please review the order and send a new quote.'
    send_job_quote:
      # The quote mail is in French, then English; subject: "<French> // <English>"
      subject_approved: "Your job order #%{id} has been approved"
      subject_reapproved: "Your job order #%{id} has been re-approved"
      preheader: "Makerepo - Job Order Approval"
      # %{site_link} = link to makerepo.com
      why_received_html: "You have received this email because a Job Order was approved on %{site_link}."
      reminder: "This is a reminder that admins have approved a Job Order. Please review the quote and approve or deny it."
      # %{link} = link to the approval page, text from page_link
      approved_html: "Your Job Order with ID #%{id} has been approved. Check the %{link} to approve or deny the quote."
      page_link: "Job Order page"
      pricing: "Pricing:"
      # %{amount} = an amount of money
      amount: "CAD %{amount}"
      # Start of the price breakdown of a task, followed by "<quantity> <unit> × <unit price>"
      base_fee: "base fee of %{amount} plus"
      # Shown when the service has no unit of its own
      unit: "unit"
      pending: "Pending pricing"
      line_items: "Line items:"
      grand_total: "Grand Total:"
      # Button text: "<French> / <English>"
      button: "See Order"
    send_job_declined:
      subject: "Your job #%{id} has been declined"
      preheader: "Makerepo - Job Order Declined"
      # %{site_link} = link to makerepo.com
      why_received_html: "You have received this email because a Job Order has been declined on %{site_link}."
      body: "Admins have declined a Job order with ID #%{id}."
      comments: "Please see for the following comments from admins for more details:"
      # %{contact} = the makerspace address, as a mail link
      contact_html: "If you require any further assistance or have question about the current declined order, please contact us at %{contact}. Please include the Job Order ID #%{id} in your email."
    send_job_user_approval:
      subject: "A user has approved a Job Order"
      preheader: "Makerepo - Job Order User Approval"
      # %{site_link} = link to makerepo.com
      why_received_html: "You have received this email because a user has approved a Job Order on %{site_link}."
      # %{link} = link to the job order admin page, text from page_link
      body_html: "A user has approved Job order with ID %{id}. Check the %{link} for details."
      page_link: "Job Order page"
    send_job_user_declined:
      subject: "A user has declined a Job Order"
      preheader: "Makerepo - Job Order User Decline"
      # %{site_link} = link to makerepo.com
      why_received_html: "You have received this email because a user has declined a Job Order on %{site_link}."
      # %{link} = link to the job order admin page, text from page_link
      body_html: "A user has declined Job order with ID %{id}. Check the %{link} for details."
      page_link: "Job Order page"
    send_job_decision_confirmation:
      # The confirmation is in French, then English; subject: "<French> // <English>"
      subject_approved: "Your approval of job order #%{id} is recorded"
      subject_declined: "Your decline of job order #%{id} is recorded"
      # Preheader: "MakerRepo - <French> // <English>"
      confirmation: "Confirmation"
      # %{site_link} = link to makerepo.com
      why_received_html: "You received this email because you responded to the quote of your job order on %{site_link}."
      approved: "We have recorded your approval of the quote for job order #%{id}. MakerRepo staff will now process it."
      declined: "We have recorded your decline of the quote for job order #%{id}."
      # %{contact} = the makerspace address, as a mail link
      questions_html: "If you have any questions, email %{contact} and include the job order number."
    send_job_completed:
      subject: "Your Job Order #%{id} has been completed"
      preheader: "Makerepo - Job Order Completed"
      # %{site_link} = link to makerepo.com
      why_received_html: "You have received this email because a new Job Order has been approved on %{site_link}."
      button: "Pay by Credit Card"
    payment_succeeded:
      subject: "Your Job Order #%{id} is now ready for pickup"
      preheader: "Makerepo - Job Order Payment Succeeded"
      # %{site_link} = link to makerepo.com
      why_received_html: "You have received this email because your payment for Job Order was successful on %{site_link}."
      body: "We are happy to inform you that your Payment for the Job Order #%{id} has been successfully completed! Please email makerspace@uottawa.ca to arrange for pick up of your part or if you have any questions."
      button: "View Order"
    staff_assigned:
      subject: "You've been assigned to Job Order #%{id}"
      preheader: "Makerepo - Staff Assignment Notification"
      # The mail is in French, then English. %{site_link} = link to makerepo.com
      why_received_html: "You received this email because an administrator assigned you to a job order on %{site_link}."
      hello: "Hello %{name},"
      body: "You have been assigned to Job Order #%{id} by an administrator."
      details: "Job Order Details:"
      client: "Client: %{name}"
      expedited: "(EXPEDITED ORDER)"
      button: "View Job Order"
  chat_message_mailer:
    new_message:
      # The mail is in French, then English; subject: "MakerRepo - <French> // <English>"
      subject: "New message"
      # %{site_link} = link to makerepo.com
      why_received_html: "You received this email because a new message was posted on your job order on %{site_link}."
      hello: "Hello,"
      # %{sender} = the sender's name
      body: "You have received a new message regarding your Job Order #%{id} from %{sender}."
      message: "Message:"
      button: "View Job Order"
  time:
    formats:
      # The date on the printable invoice
      job_order_invoice: "%Y/%m/%d"
