      share_alike:
        label: "Partage dans les mêmes conditions"
        text: "Si vous remixez, transformez ou créez à partir du matériel, vous devez diffuser vos contributions sous la même licence que l'original."
      no_derivatives:
        label: "Pas de modification"
        text: "Si vous remixez, transformez ou créez à partir du matériel, vous n'êtes pas autorisé à distribuer le matériel modifié."
