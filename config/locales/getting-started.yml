en:
  getting_started:
    layout_title: "Getting Started | MakerRepo"
    sidebar:
      help_center: "Help Center"
      title: "Getting Started"
      setting_up_account: "Setting up an account"
      creating_repository: "Creating a repository"
      contact_html: "If any error occurs, or if you would like to make a suggestion, do not hesitate to %{contact_link}."
      contact_link: "contact us"
    setting_up_account:
      title: "Setting Up An Account"
      sign_up_html: "If you don't have an MakerRepo account yet, just head on over to %{new_user_link} or click the <b>Sign Up</b> button on the %{home_link}."
      home_link: "home page"
      repository_name_html: "Create a short, memorable repository name. <b>All of your own repository names must be unique and must not contain special characters with the exception of a hyphen.</b> For example, \"hello-world\"."
      email_html: "Enter in a valid email address. For example, \"johndoe@example.com\"."
      password_html: "Enter in your password. Your password must contain: <b>10 characters, 5 unique characters, and not be a commonly used password.</b>"
      free_html: "Signing up and creating an MakerRepo account is totally free! After you sign up, please be sure to complete your profile and %{github_link}."
      github_link: "link your MakerRepo account to your Github account"
    creating_repository:
      title: "Creating A Repository"
      create_button_html: "In the upper-right corner of any page, click the <b>Create</b> button."
      repository_name_html: "Create a short, memorable repository name. <b>All of your repository names must be unique and must not contain special characters with the exception of a hyphen.</b> For example, \"hello-world\"."
      description: "Optionally, submit a description of your repository."
      github_html: "Optionally, create a github repository or link to an existing repository. <b>You must have your %{account_link} to have this option.</b>"
      account_link: "account linked to github"
      files: "Optionally, add files. Files are stored inside of your github repository."
      photos_html: "Submit photos of your projects. <b>A minimum of one photo must be submitted.</b>"
      category: "Select a category that best fits your repository."
      tags: "Optionally, add tags."
      license_html: "Select a license, there are five different license that may be chosen from. For example, the %{license_link} license."
      license_link: "Creative Common - Attribution"
fr:
  getting_started:
    layout_title: "Pour commencer | MakerRepo"
    sidebar:
      help_center: "Centre d'Aide"
      title: "Pour commencer"
      setting_up_account: "Créer un compte"
      creating_repository: "Créer un dépôt"
      contact_html: "Si une erreur survient, ou si vous souhaitez faire une suggestion, n'hésitez pas à %{contact_link}."
      contact_link: "nous contacter"
    setting_up_account:
      title: "Créer un compte"
      sign_up_html: "Si vous n'avez pas encore de compte MakerRepo, rendez-vous sur %{new_user_link} ou cliquez sur le bouton <b>Créer un compte</b> de la %{home_link}."
      home_link: "page d'accueil"
      repository_name_html: "Choisissez un nom de dépôt court et facile à retenir. <b>Les noms de tous vos dépôts doivent être uniques et ne doivent pas contenir de caractères spéciaux, à l'exception du trait d'union.</b> Par exemple, « hello-world »."
      email_html: "Saisissez une adresse courriel valide. Par exemple, « johndoe@example.com »."
      password_html: "Saisissez votre mot de passe. Votre mot de passe doit contenir : <b>10 caractères, dont 5 caractères différents, et ne pas être un mot de passe couramment utilisé.</b>"
      free_html: "L'inscription et la création d'un compte MakerRepo sont entièrement gratuites! Après votre inscription, n'oubliez pas de compléter votre profil et de %{github_link}."
      github_link: "lier votre compte MakerRepo à votre compte GitHub"
    creating_repository:
      title: "Créer un dépôt"
      create_button_html: "Dans le coin supérieur droit de n'importe quelle page, cliquez sur le bouton <b>Créer</b>."
      repository_name_html: "Choisissez un nom de dépôt court et facile à retenir. <b>Les noms de tous vos dépôts doivent être uniques et ne doivent pas contenir de caractères spéciaux, à l'exception du trait d'union.</b> Par exemple, « hello-world »."
      description: "Si vous le souhaitez, ajoutez une description de votre dépôt."
      github_html: "Si vous le souhaitez, créez un dépôt GitHub ou liez un dépôt existant. <b>Pour avoir cette option, vous devez avoir %{account_link}.</b>"
      account_link: "lié votre compte à GitHub"
      files: "Si vous le souhaitez, ajoutez des fichiers. Les fichiers sont stockés dans votre dépôt GitHub."
      photos_html: "Ajoutez des photos de vos projets. <b>Au moins une photo doit être soumise.</b>"
      category: "Choisissez la catégorie qui convient le mieux à votre dépôt."
      tags: "Si vous le souhaitez, ajoutez des étiquettes."
      license_html: "Choisissez une licence parmi les cinq licences proposées. Par exemple, la licence %{license_link}."
      license_link: "Creative Commons - Attribution"
