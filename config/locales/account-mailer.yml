en:
  layouts:
    mailer:
      title: "Transactional Email"
      preheader: "MakerRepo Notification"
      logo_alt: "CEED Logo"
      thank_you: "Thank you,"
      # Sign-off of a mail that names no team
      ceed_team: "CEED Team"
      makerrepo_team: "The MakerRepo Team"
      address: "CEED, 150 Louis Pasteur, Ottawa ON Canada K1N 6N5"
      why_received: "You received this email from MakerRepo."
      # Footer of the plain-text layout
      makerspace: "Richard L'Abbé Makerspace"
      university: "University of Ottawa"
  msr_mailer:
    account:
      hello: "Hello %{name},"
    confirmation_email:
      subject: "Makerepo | Please confirm your email"
      preheader: "Makerepo - Welcome to MakerRepo"
      # %{site_link} = link to makerepo.com
      why_received_html: "You have received this email because you created a new account on %{site_link}."
      almost_done: "You are almost done signing up to MakerRepo.com."
      # %{link} = the confirmation link, text from link_text
      confirm_html: "Please confirm your email with the following %{link}."
      link_text: "link"
      # %{url} = the confirmation address, shown as text
      copy_link: "If the link doesn't work, you can copy the following link : %{url}"
      button: "Confirm Account"
    email_confirmation_email:
      subject: "Makerepo | Please confirm your new email"
      preheader: "Makerepo - Confirm your email change"
      # %{site_link} = link to makerepo.com
      why_received_html: "You have received this email because you asked for an email change on %{site_link}."
      # %{site_link} = link to MakerRepo.com
      request_html: "We received a request to change your email address to this one for %{site_link}."
      # %{link} = the confirmation link, text from link_text
      open_link_html: "If you did ask for this change, please open the following %{link} while signed in to your account, and confirm the change on that page."
      link_text: "link"
      # %{url} = the confirmation address, shown as text
      copy_link: "If the link isn't working, try copy/pasting the following address : %{url}"
      not_requested: "If you did not request this change, you do not have to do anything."
      button: "Confirm Email Change"
    email_changed_email:
      subject: "Makerepo | Email has changed"
      preheader: "Makerepo - Your email has been changed"
      # %{site_link} = link to makerepo.com
      why_received_html: "You have received this email because an email change has been done on your %{site_link} account."
      changed_to: "Your email has been changed to the following email address : %{email}."
      if_you: "If you changed it, you don't have to do anything, you can start using your new email address."
      # %{contact} = the MakerRepo contact address, as a mail link
      if_not_html: "If you did not make that change, please contact %{contact} as soon as possible so we can fix this issue."
    confirm_password_change:
      subject: "MakerRepo | Your password has been changed"
      preheader: "Makerepo - Your password has been changed"
      # %{site_link} = link to makerepo.com
      why_received_html: "You have received this email because there was a password change on an active account linked to this email on %{site_link}."
      changed: "Your MakerRepo password has been changed. If you initiated this change, you have nothing to do."
      if_not: "If you did not ask for this change, please reset your password immediately and let us know by replying to this email. We will can then investigate on this issue."
    welcome_email:
      subject: "Welcome to MakerRepo"
      preheader: "Makerepo - Welcome to MakerRepo"
      # %{site_link} = link to makerepo.com
      why_received_html: "You have received this email because you successfully signed up at %{site_link}."
      signed_up: "You have successfully signed up to MakerRepo.com."
      # %{username} = the username, in bold
      username_html: "Your username is: %{username}."
      # %{link} = link to the sign-in page
      sign_in_html: "Sign in to your account: %{link}"
      button: "Login to your Account"
    forgot_password:
      subject: "Reset your MakerRepo password"
      preheader: "Makerepo - Reset your password"
      # %{site_link} = link to makerepo.com
      why_received_html: "You have received this email because you asked for a password reset on an active account on %{site_link}."
      hello: "Hello,"
      asked: "You asked for a password reset on your MakerRepo account. Please click on the link below to reset your password. The link will be valid for 2 hours and can be used once."
      if_not: "If you did not ask for a password reset, please ignore this email."
      button: "Reset Password"
      # %{url} = the reset address, shown as text
      copy_link: "If you could not open the link copy and paste the following link : %{url}"
    unlock_account:
      subject: "Unlock your MakerRepo Account"
      preheader: "MakerRepo - Account Locked"
      # %{site_link} = link to makerepo.com
      why_received_html: "You have received this email because your account was locked due to multiple unsuccessful login attempts on %{site_link}."
      attempts: "Your account on MakerRepo had 5 unsuccessful login attempts."
      # %{url} = the unlock address, shown as text
      unlock: "To unlock your account, click the button below or copy this link: %{url}"
      # %{link} = link to the forgotten password page
      forgot_html: "If you have forgotten your password, you can reset it by clicking this link or copying it: %{link}"
      button: "Unlock your Account"
    # Shared by the exam mails. %{training} = the training's name
    exam:
      in_training_html: "You are receiving this email because you were in the <b>%{training} at uOttawa.</b>"
    exam_results_staff:
      # %{name} = the trainee's first name
      subject: "%{name} finished an exam"
      preheader: "Makerepo - Exam completed"
      # Followed by a link to makerepo.com
      why_received: "You have received this email because you were responsible of a training session with an exam on"
      # Followed by the training session, in bold
      responsible: "You are receiving this email because you were the responsible staff for the"
      # %{date} = the day the session was created
      session: "%{training} at uOttawa (%{date})"
      result:
        passed: "%{name} finished the exam and his/her score was %{score}. Hence, He/she passed the exam."
        failed: "%{name} finished the exam and his/her score was %{score}. Hence, He/she failed the exam."
        # An exam that is not graded yet; %{status} = its status
        other: "%{name} finished the exam and his/her score was %{score}. Hence, He/she %{status} the exam."
      retry: "If this is his/her first try, he/she will be able to try one more time."
      no_action: "No more actions are needed."
    finishing_exam:
      subject: "You finished your exam"
      preheader: "Makerepo - You finished an exam"
      # Followed by a link to makerepo.com
      why_received: "You have received this email because you have completed an exam on"
      result:
        passed: "You finished your exam. Your score was %{score}. You passed the exam."
        failed: "You finished your exam. Your score was %{score}. You failed the exam."
        # An exam that is not graded yet; %{status} = its status
        other: "You finished your exam. Your score was %{score}. You %{status} the exam."
      congratulations: "Congratulations. Your certification is already available in your profile."
      retry: "If this is your first try, you will be able to try one more time."
      # %{link} = link to the exams page, text from exams_link
      check_html: "Check %{link} for new exams."
      exams_link: "Exams"
    send_exam:
      subject: "An exam was sent to you"
      preheader: "Makerepo - Complete Your Exam"
      # Followed by a link to makerepo.com
      why_received: "You have received this email because you have an exam to complete on"
      # Followed by the sign-in link, text from log_in
      sign_in: "Sign in to your account:"
      log_in: "Log In"
      # %{link} = link to the exams page, text from exams_link
      check_html: "and check all the exams available %{link}."
      exams_link: "Exams"
      deadline: "You have 3 days to complete the exam."
      button: "Start exam"
    issue_email:
      # %{subject} = the subject the reporter typed
      subject: "Issue Report | %{subject}"
      preheader: "Makerepo - Issue Report Received"
      # Followed by a link to makerepo.com
      why_received: "You have received this email because you submitted an issue on"
      received: "We have received the following help request from you:"
      # %{name} = the name the reporter typed, in bold
      reported_by_html: "New issue reported by %{name}:"
      account: "Account:"
      contact_email: "Contact email:"
      # %{subject} = the subject the reporter typed, in bold
      subject_line_html: "Subject: %{subject}"
      app_version: "App Version: %{version}"
    print_failed:
      # %{printer} = the printer's number
      subject: "Your 3D print on %{printer} has failed"
      preheader: "Makerepo - New Message"
      why_received: "You have received this email because you started a print job at the MakerSpace"
    send_kit_email:
      subject: "Your proficient project kit order"
      preheader: "Makerepo - Your Kit is Ready"
      # Followed by a link to makerepo.com
      why_received: "You have received this email because you bought a Proficient Project Kit on"
      # Followed by a link to the opening hours, text from opening_hours
      received: "We received your kit order for your %{project} project. You can pick it up at the UOttawa Makerspace during the regular"
      opening_hours: "opening hours"
    send_results_pp:
      subject: "Your Proficient Project Results"
      preheader: "MakerRepo - Proficient Project Results"
      # Followed by a link to makerepo.com
      why_received: "You have received this email because you submitted a proficient project for evaluation on"
      received: "We have received the results for the proficient project (%{project})."
      passed_html: "We're excited to inform you that your proficient project has <b>passed</b>"
      failed_html: "We regret to inform you that your proficient project has <b>failed</b>"
      # %{link} = link to the skills page, text from here
      progress_html: "You can see your progress %{link}"
      here: "here"
      admin_comments: "Admin Comments:"
      none: "None"
      button: "See my progress"
    send_user_pp_evaluation:
      subject: "Your Proficient Project Request"
      preheader: "MakerRepo - Proficient Project Submitted"
      # Followed by a link to makerepo.com
      why_received: "You have received this email because you submitted a proficient project on"
      submitted: "The proficient project (%{project}) has been submitted successfully."
      # %{location} = the drop-off location's name
      drop_off_html: "Please <b>drop off</b> your project <b>here</b>: %{location}"
      no_drop_off: "This project has no drop-off locations. If you think this is an error or you have any questions about it,"
      # %{email} = the address of the team that evaluates the project
      contact: "please contact %{email}."
      review: "After the drop-off (if your project needs to be dropped-off), we will review it and get back to you within 5 business days."
      questions: "If you have any questions, feel free to contact us at %{email}."
    # Shared by the volunteer task mails
    volunteer_task:
      hello: "Hello!"
      # %{link} = link to the task or the requests page, text from here
      check_html: "Check it %{link}."
      here: "here"
      # %{email} = the volunteer team's or the task's staff address
      more_info: "If you need more information, you can send an email to %{email}."
    send_notification_to_staff_for_joining_task:
      # %{task} = the task's title
      subject: "New join in task: %{task}"
      preheader: "Makerepo - User Joined Volunteer Task"
      # Followed by a link to makerepo.com
      why_received: "You have received this email because a user joined a volunteer task on"
      # %{volunteer} and %{task} in bold
      joined_html: "The user %{volunteer} joined the task %{task}."
    send_notification_to_volunteer_for_joining_task:
      subject: "New join in task: %{task}"
      preheader: "Makerepo - You Joined a Volunteer Task"
      # Followed by a link to makerepo.com
      why_received: "You have received this email because you joined a volunteer task on"
      joined_html: "You just joined the task %{task}."
    send_notification_for_task_request:
      subject: "New Request for task: %{task}"
      preheader: "Makerepo - New Volunteer Task Request"
      # Followed by a link to makerepo.com
      why_received: "You have received this email because a new volunteer task request was made on"
      new_request_html: "A new request was made for the Task %{task}."
    send_notification_for_task_request_update:
      subject: "Your request was updated: %{task}"
      preheader: "Makerepo - Volunteer Task Update"
      # Followed by a link to makerepo.com
      why_received_html: "You have received this email because a volunteer task you're interested in was updated on"
      update_html: "An update was made for the Task %{task}."
  task_mailer:
    hello: "Hello,"
    renamed_user:
      subject: "Makerepo | Your account username was renamed"
      preheader: "Makerepo - Username changed"
      # Followed by a link to makerepo.com
      why_received: "You have received this email because you have an account on"
      changed: "Due to database maintenance reasons, we have changed your account username."
      # %{previous} and %{new} = the usernames, in bold
      from_to_html: "Your username was changed from %{previous} to %{new}."
      use_new: "You should use your new username to login to your account."
      email_login: "You can also login using your email as well."
      password: "Your password has not been changed."
      contact: "If you would like to change your username or if you have another account you would like us to merge, please contact us for assistance or visit one of the CEED spaces at STEM."
    merged_user:
      subject: "Makerepo | Duplicate accounts merged"
      preheader: "Makerepo - Accounts merged"
      # Followed by a link to makerepo.com
      why_received: "You have received this email because you have duplicated accounts on"
      # %{email} = the address, in bold
      found_html: "During database maintenance, we have found multiple accounts registered to this email address: %{email}."
      merged: "We have merged all your accounts into the one we detected to be the most active."
      # %{username} in bold
      username_html: "Your username is %{username}."
      verify: "You can still login with your email to verify the data appended to your account."
      no_action: "If your stored login details still work, there is no action needed from you."
      # %{link} = link to the forgotten password page, text from reset_link
      reset_html: "If you cannot remember your password, or your password no longer works, you can reset it via the %{link}."
      reset_link: "forgot password form"
      assistance: "If you need assistance, or if you have any questions, feel free to reach out to us or visit one of the CEED spaces in STEM."
  time:
    formats:
      # Day a training session was created, in the exam results mail to staff
      exam_session_mail: "%b %e %Y"
fr:
  layouts:
    mailer:
      title: "Courriel transactionnel"
      preheader: "Notification MakerRepo"
      logo_alt: "Logo du CGEC"
      thank_you: "Merci,"
      # Sign-off of a mail that names no team
      ceed_team: "L'équipe du CGEC"
      makerrepo_team: "L'équipe MakerRepo"
      address: "CGEC, 150, rue Louis-Pasteur, Ottawa (Ontario) Canada K1N 6N5"
      why_received: "Vous avez reçu ce courriel de MakerRepo."
      # Footer of the plain-text layout
      makerspace: "Makerspace Richard-L'Abbé"
      university: "Université d'Ottawa"
  msr_mailer:
    account:
      hello: "Bonjour %{name},"
    confirmation_email:
      subject: "MakerRepo | Veuillez confirmer votre courriel"
      preheader: "MakerRepo - Bienvenue sur MakerRepo"
      # %{site_link} = link to makerepo.com
      why_received_html: "Vous avez reçu ce courriel parce que vous avez créé un compte sur %{site_link}."
      almost_done: "Votre inscription sur MakerRepo.com est presque terminée."
      # %{link} = the confirmation link, text from link_text
      confirm_html: "Veuillez confirmer votre courriel en suivant ce %{link}."
      link_text: "lien"
      # %{url} = the confirmation address, shown as text
      copy_link: "Si le lien ne fonctionne pas, copiez le lien suivant : %{url}"
      button: "Confirmer mon compte"
    email_confirmation_email:
      subject: "MakerRepo | Veuillez confirmer votre nouveau courriel"
      preheader: "MakerRepo - Confirmez le changement de courriel"
      # %{site_link} = link to makerepo.com
      why_received_html: "Vous avez reçu ce courriel parce que vous avez demandé un changement de courriel sur %{site_link}."
      # %{site_link} = link to MakerRepo.com
      request_html: "Nous avons reçu une demande pour remplacer votre adresse courriel sur %{site_link} par celle-ci."
      # %{link} = the confirmation link, text from link_text
      open_link_html: "Si vous avez demandé ce changement, ouvrez ce %{link} en étant connecté à votre compte, puis confirmez le changement sur cette page."
      link_text: "lien"
      # %{url} = the confirmation address, shown as text
      copy_link: "Si le lien ne fonctionne pas, copiez et collez l'adresse suivante : %{url}"
      not_requested: "Si vous n'avez pas demandé ce changement, vous n'avez rien à faire."
      button: "Confirmer le changement de courriel"
    email_changed_email:
      subject: "MakerRepo | Votre courriel a été changé"
      preheader: "MakerRepo - Votre courriel a été changé"
      # %{site_link} = link to makerepo.com
      why_received_html: "Vous avez reçu ce courriel parce que le courriel de votre compte %{site_link} a été changé."
      changed_to: "Votre courriel a été remplacé par l'adresse suivante : %{email}."
      if_you: "Si c'est vous qui l'avez changé, vous n'avez rien à faire : vous pouvez utiliser votre nouvelle adresse dès maintenant."
      # %{contact} = the MakerRepo contact address, as a mail link
      if_not_html: "Si vous n'avez pas fait ce changement, écrivez dès que possible à %{contact} pour que nous puissions corriger la situation."
    confirm_password_change:
      subject: "MakerRepo | Votre mot de passe a été changé"
      preheader: "MakerRepo - Votre mot de passe a été changé"
      # %{site_link} = link to makerepo.com
      why_received_html: "Vous avez reçu ce courriel parce que le mot de passe d'un compte actif lié à ce courriel a été changé sur %{site_link}."
      changed: "Votre mot de passe MakerRepo a été changé. Si c'est vous qui avez fait ce changement, vous n'avez rien à faire."
      if_not: "Si vous n'avez pas demandé ce changement, réinitialisez votre mot de passe immédiatement et prévenez-nous en répondant à ce courriel. Nous pourrons alors examiner la situation."
    welcome_email:
      subject: "Bienvenue sur MakerRepo"
      preheader: "MakerRepo - Bienvenue sur MakerRepo"
      # %{site_link} = link to makerepo.com
      why_received_html: "Vous avez reçu ce courriel parce que vous vous êtes inscrit sur %{site_link}."
      signed_up: "Votre inscription sur MakerRepo.com est terminée."
      # %{username} = the username, in bold
      username_html: "Votre nom d'utilisateur est : %{username}."
      # %{link} = link to the sign-in page
      sign_in_html: "Connectez-vous à votre compte : %{link}"
      button: "Me connecter à mon compte"
    forgot_password:
      subject: "Réinitialisez votre mot de passe MakerRepo"
      preheader: "MakerRepo - Réinitialisez votre mot de passe"
      # %{site_link} = link to makerepo.com
      why_received_html: "Vous avez reçu ce courriel parce que vous avez demandé la réinitialisation du mot de passe d'un compte actif sur %{site_link}."
      hello: "Bonjour,"
      asked: "Vous avez demandé la réinitialisation du mot de passe de votre compte MakerRepo. Cliquez sur le bouton ci-dessous pour réinitialiser votre mot de passe. Le lien est valide pendant 2 heures et ne peut être utilisé qu'une fois."
      if_not: "Si vous n'avez pas demandé de réinitialisation, ignorez ce courriel."
      button: "Réinitialiser mon mot de passe"
      # %{url} = the reset address, shown as text
      copy_link: "Si vous ne pouvez pas ouvrir le lien, copiez et collez le lien suivant : %{url}"
    unlock_account:
      subject: "Déverrouillez votre compte MakerRepo"
      preheader: "MakerRepo - Compte verrouillé"
      # %{site_link} = link to makerepo.com
      why_received_html: "Vous avez reçu ce courriel parce que votre compte a été verrouillé après plusieurs tentatives de connexion infructueuses sur %{site_link}."
      attempts: "Votre compte MakerRepo a eu 5 tentatives de connexion infructueuses."
      # %{url} = the unlock address, shown as text
      unlock: "Pour déverrouiller votre compte, cliquez sur le bouton ci-dessous ou copiez ce lien : %{url}"
      # %{link} = link to the forgotten password page
      forgot_html: "Si vous avez oublié votre mot de passe, vous pouvez le réinitialiser en cliquant sur ce lien ou en le copiant : %{link}"
      button: "Déverrouiller mon compte"
    # Shared by the exam mails. %{training} = the training's name
    exam:
      in_training_html: "Vous recevez ce courriel parce que vous avez participé à la séance <b>%{training} à uOttawa.</b>"
    exam_results_staff:
      # %{name} = the trainee's first name
      subject: "%{name} a terminé un examen"
      preheader: "MakerRepo - Examen terminé"
      # Followed by a link to makerepo.com
      why_received: "Vous avez reçu ce courriel parce que vous étiez responsable d'une séance de formation avec examen sur"
      # Followed by the training session, in bold
      responsible: "Vous recevez ce courriel parce que vous étiez le membre du personnel responsable de la séance"
      # %{date} = the day the session was created
      session: "%{training} à uOttawa (%{date})"
      result:
        passed: "%{name} a terminé l'examen avec une note de %{score}. Cette personne a donc réussi l'examen."
        failed: "%{name} a terminé l'examen avec une note de %{score}. Cette personne a donc échoué à l'examen."
        # An exam that is not graded yet; %{status} = its status
        other: "%{name} a terminé l'examen avec une note de %{score}. Statut de l'examen : %{status}."
      retry: "S'il s'agit de sa première tentative, cette personne pourra essayer une autre fois."
      no_action: "Vous n'avez rien d'autre à faire."
    finishing_exam:
      subject: "Vous avez terminé votre examen"
      preheader: "MakerRepo - Vous avez terminé un examen"
      # Followed by a link to makerepo.com
      why_received: "Vous avez reçu ce courriel parce que vous avez terminé un examen sur"
      result:
        passed: "Vous avez terminé votre examen. Votre note est de %{score}. Vous avez réussi l'examen."
        failed: "Vous avez terminé votre examen. Votre note est de %{score}. Vous avez échoué à l'examen."
        # An exam that is not graded yet; %{status} = its status
        other: "Vous avez terminé votre examen. Votre note est de %{score}. Statut de l'examen : %{status}."
      congratulations: "Félicitations! Votre certification est déjà disponible dans votre profil."
      retry: "S'il s'agit de votre première tentative, vous pourrez essayer une autre fois."
      # %{link} = link to the exams page, text from exams_link
      check_html: "Consultez la page %{link} pour voir les nouveaux examens."
      exams_link: "Examens"
    send_exam:
      subject: "Un examen vous a été envoyé"
      preheader: "MakerRepo - Faites votre examen"
      # Followed by a link to makerepo.com
      why_received: "Vous avez reçu ce courriel parce que vous avez un examen à faire sur"
      # Followed by the sign-in link, text from log_in
      sign_in: "Connectez-vous à votre compte :"
      log_in: "Connexion"
      # %{link} = link to the exams page, text from exams_link
      check_html: "et consultez tous les examens disponibles sur la page %{link}."
      exams_link: "Examens"
      deadline: "Vous avez 3 jours pour faire l'examen."
      button: "Commencer l'examen"
    issue_email:
      # %{subject} = the subject the reporter typed
      subject: "Signalement de problème | %{subject}"
      preheader: "MakerRepo - Signalement de problème reçu"
      # Followed by a link to makerepo.com
      why_received: "Vous avez reçu ce courriel parce que vous avez signalé un problème sur"
      received: "Nous avons reçu la demande d'aide suivante de votre part :"
      # %{name} = the name the reporter typed, in bold
      reported_by_html: "Nouveau problème signalé par %{name} :"
      account: "Compte :"
      contact_email: "Courriel de contact :"
      # %{subject} = the subject the reporter typed, in bold
      subject_line_html: "Objet : %{subject}"
      app_version: "Version de l'application : %{version}"
    print_failed:
      # %{printer} = the printer's number
      subject: "Votre impression 3D sur l'imprimante %{printer} a échoué"
      preheader: "MakerRepo - Nouveau message"
      why_received: "Vous avez reçu ce courriel parce que vous avez lancé une impression au Makerspace"
    send_kit_email:
      subject: "Votre commande de trousse de projet de compétence"
      preheader: "MakerRepo - Votre trousse est prête"
      # Followed by a link to makerepo.com
      why_received: "Vous avez reçu ce courriel parce que vous avez acheté une trousse de projet de compétence sur"
      # Followed by a link to the opening hours, text from opening_hours
      received: "Nous avons reçu votre commande de trousse pour votre projet %{project}. Vous pouvez venir la chercher au Makerspace de uOttawa pendant les"
      opening_hours: "heures d'ouverture"
    send_results_pp:
      subject: "Résultats de votre projet de compétence"
      preheader: "MakerRepo - Résultats du projet de compétence"
      # Followed by a link to makerepo.com
