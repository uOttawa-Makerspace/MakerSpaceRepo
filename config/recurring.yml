# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

# Tasks every environment runs. Production and staging add their own below.
shared: &shared
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  tap_box_log_cleanup:
    class: TapBoxLogCleanupJob
    schedule: every day at 3am

  prune_api_refresh_tokens:
    command: "ApiRefreshToken.prune!"
    schedule: every day at 3:30am

  prune_rate_limit_counters:
    command: "RateLimitCounter.prune!"
    schedule: every 5 minutes

  # Reclaims Shopify drafts no job order points at (orphans of a rollback after a Shopify create).
  # Same code as `rake job_orders:sweep_orphan_drafts` (JobOrder::DraftSweep).
  job_order_draft_sweep:
    class: JobOrderDraftSweepJob
    schedule: every hour at minute 42

  # Hourly head count folded into the running mean behind the admin "Popular Hours" report.
  popular_hours:
    command: "PopularHour.record_current_hour!"
    schedule: every hour at minute 50

  # Volunteer programs follow last_seen_at (inactive after two months unseen); a repeat run changes nothing.
  active_volunteers_status:
    command: "Program.refresh_volunteer_activity!"
    schedule: every day at 2am

  clear_printer_sessions:
    command: "PrinterSession.clear_in_use!"
    schedule: every day at 2:30am

  # Mails the renters of rentals that expired within LockerRental::EXPIRY_NOTICE_WINDOW, once each.
  locker_expiry_notices:
    command: "LockerRental.notify_expired_rentals!"
    schedule: every day at 8:30am

  # Registers a fresh Google Calendar push channel (see GoogleCalendar::WebhookRegistrar).
  google_calendar_webhook:
    command: "GoogleCalendar::WebhookRegistrar.register!"
    schedule: every sunday at 3am

production:
  <<: *shared

  # Last month's CDEL reports, mailed to the inbox whose Power Automate flow files them in SharePoint.
  cdel_report:
    class: CdelReportJob
    schedule: "0 0 1 * *"

staging:
  <<: *shared

  # Catch-up listing of the Google Calendar (production is kept current by the webhook's pushes).
  google_calendar_sync:
    class: GoogleCalendarSyncJob
    schedule: every sunday at 3am
