# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production: &production
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  tap_box_log_cleanup:
    class: TapBoxLogCleanupJob
    schedule: every day at 3am

  prune_api_refresh_tokens:
    command: "ApiRefreshToken.prune!"
    schedule: every day at 3:30am

  prune_rate_limit_counters:
    command: "RateLimitCounter.prune!"
    schedule: every 5 minutes

  # Reclaims Shopify drafts no job order points at (orphans of a rollback after a Shopify create).
  # Same code as `rake job_orders:sweep_orphan_drafts` (JobOrder::DraftSweep).
  job_order_draft_sweep:
    class: JobOrderDraftSweepJob
    schedule: every hour at minute 42

staging:
  <<: *production
