# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

# Tasks every environment runs. Production and staging add their own below.
shared: &shared
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  tap_box_log_cleanup:
    class: TapBoxLogCleanupJob
    schedule: every day at 3am

  kiosk_sign_event_cleanup:
    class: KioskSignEventCleanupJob
    schedule: every day at 3:15am

  prune_api_refresh_tokens:
    command: "ApiRefreshToken.prune!"
    schedule: every day at 3:30am

  prune_rate_limit_counters:
    command: "RateLimitCounter.prune!"
    schedule: every 5 minutes

  # Reclaims Shopify drafts no job order and no locker rental points at (orphans of a rollback or a crash after a
  # Shopify create). The job-order part is the code of `rake job_orders:sweep_orphan_drafts` (JobOrder::DraftSweep);
  # the locker part is LockerRental::DraftSweep.
  job_order_draft_sweep:
    class: JobOrderDraftSweepJob
    schedule: every hour at minute 42

  # Hands out the stored Shopify orders that are due (new ones, retries, expired leases) and reports the ones
  # nothing has dispatched for hours. ProcessedOrder is the schedule.
  dispatch_due_orders:
    class: DispatchDueOrdersJob
    schedule: every minute

  # Blanks the payload (customer data) of Shopify orders applied more than 90 days ago; the rows stay.
  purge_processed_order_payloads:
    class: PurgeProcessedOrderPayloadsJob
    schedule: every day at 4am

  # Hourly head count folded into the running mean behind the admin "Popular Hours" report.
  popular_hours:
    command: "PopularHour.record_current_hour!"
    schedule: every hour at minute 50

  # Volunteer programs follow last_seen_at (inactive after two months unseen); a repeat run changes nothing.
  active_volunteers_status:
    command: "Program.refresh_volunteer_activity!"
    schedule: every day at 2am

  # Trims the repository zip cache to its size cap and free-space floor and removes partial zips and old
  # repo_file* temp files (Repository::ZipCache).
  repository_zip_cache_cleanup:
    class: RepositoryZipCacheCleanupJob
    schedule: every hour at minute 22

  clear_printer_sessions:
    command: "PrinterSession.clear_in_use!"
    schedule: every day at 2:30am

  # Mails the renters of rentals that expired within LockerRental::EXPIRY_NOTICE_WINDOW, once each.
  locker_expiry_notices:
    command: "LockerRental.notify_expired_rentals!"
    schedule: every day at 8:30am

  # membership_expiry (MembershipExpiryJob, Membership::Expiry) is held: it is not scheduled until the pending
  # duplicate membership checkouts are reviewed, because its first run would close every stale checkout at once.
  # To turn it on, add this entry back here and flip the matching example in spec/config/recurring_schedule_spec.rb:
  #   membership_expiry:
  #     class: MembershipExpiryJob
  #     schedule: every day at 4am

  # Keeps one Google Calendar push channel live (stops the old one); see GoogleCalendar::WebhookRegistrar.
  google_calendar_webhook:
    command: "GoogleCalendar::WebhookRegistrar.register!"
    schedule: every sunday at 3am

  # Queues again Google Calendar pushes and removals of events that were never confirmed (GoogleCalendar::PendingChange).
  google_calendar_resend:
    class: GoogleCalendar::ResendJob
    schedule: every 15 minutes

  # Queues HelpFilingJob again for help requests that are not filed and mailed yet (a job that could not be queued, or
  # that gave up); see Help.queue_unfinished.
  help_filing_sweep:
    class: HelpFilingSweepJob
    schedule: every 15 minutes

  # Mails the maintenance address about failed and overdue background jobs, once each (JobAlert).
  job_alerts:
    class: JobAlertJob
    schedule: every 5 minutes

production:
  <<: *shared

  # Last month's CDEL reports, mailed to the inbox whose Power Automate flow files them in SharePoint.
  cdel_report:
    class: CdelReportJob
    schedule: "0 0 1 * *"

staging:
  <<: *shared

  # Catch-up listing of the Google Calendar (production is kept current by the webhook's pushes).
  google_calendar_sync:
    class: GoogleCalendarSyncJob
    schedule: every sunday at 3am
